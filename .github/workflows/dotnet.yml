name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # 1.12 - WebGlRenderer.FillRoundedRectangle: a GPU override of DIR.Lib 6.20's scanline
  #        fallback. One rounded-box SDF quad per rect instead of one FillRectangle per row -- which
  #        matters more here than on Vulkan, since every span would be its own command-buffer record
  #        crossing into JS. New PipelineId.RoundRect (id 4) + shader pair; the box parameters ride
  #        on VERTEX ATTRIBUTES because uExtra is a single float and a rounded box needs three.
  #        Custom pipeline ids now start at 5, automatically: the JS side allocates them as
  #        pipelines.length, so there was no constant to update.
  #        Re-pins DIR.Lib 6.14.* -> 6.21.* (FillRoundedRectangle 6.20, Layout.Node.Radius 6.21).
  VERSION_PREFIX: 1.12.${{ github.run_number }}
  VERSION_REV: ${{ github.run_attempt }}
  VERSION_HASH: +${{ github.sha }}
  BUILD_CONF: Release

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # No sibling checkout in CI: DIR.Lib resolves from NuGet (UseLocalDirLib=false via Exists()).
      - name: Restore
        run: dotnet restore src/WebGl.Renderer/WebGl.Renderer.csproj && dotnet restore src/WebGl.Renderer.Tests/WebGl.Renderer.Tests.csproj

      - name: Build
        run: dotnet build src/WebGl.Renderer/WebGl.Renderer.csproj -c $BUILD_CONF --no-restore -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true

      # Headless test surface: command-buffer encoding, shader-source sanity, real-font text
      # encode over a fake JS bridge. Real-browser (Playwright) coverage is a future lane.
      - name: Test
        run: dotnet test src/WebGl.Renderer.Tests/WebGl.Renderer.Tests.csproj -c $BUILD_CONF

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: src/WebGl.Renderer/bin/Release/*.nupkg

  publish-nuget:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Push to nuget.org
        run: dotnet nuget push "**/*.nupkg" -s https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_API_KEY }} --skip-duplicate
