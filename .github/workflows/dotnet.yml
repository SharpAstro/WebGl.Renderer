name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # 1.13 - Lockstep rebuild against DIR.Lib 7.0, where DeviceTransform became ContentTransform. A pure
  #        rebuild: this backend never referenced the renamed property, so no source changed and 34/34
  #        tests pass untouched. It is still worth cutting, because the alternative is a consumer on
  #        DIR.Lib 7.0 resolving a WebGl.Renderer compiled against 6.21 and trusting that the two never
  #        meet -- which happens to hold today and is not a thing to leave to luck.
  #        NOT included: composing ContentTransform into uProj. VkRenderer folds the transform into its
  #        projection (SdlVulkan.Renderer 7.0); this backend builds uProj JS-side in webgl-renderer.js
  #        and ignores the transform, so a rotated or safe-area-offset frame stays Vulkan-only.
  #        Re-pins DIR.Lib 6.21.* -> 7.0.*.
  # 1.12 - WebGlRenderer.FillRoundedRectangle: a GPU override of DIR.Lib 6.20's scanline
  #        fallback. One rounded-box SDF quad per rect instead of one FillRectangle per row -- which
  #        matters more here than on Vulkan, since every span would be its own command-buffer record
  #        crossing into JS. New PipelineId.RoundRect (id 4) + shader pair; the box parameters ride
  #        on VERTEX ATTRIBUTES because uExtra is a single float and a rounded box needs three.
  #        Custom pipeline ids now start at 5, automatically: the JS side allocates them as
  #        pipelines.length, so there was no constant to update.
  #        Re-pins DIR.Lib 6.14.* -> 6.21.* (FillRoundedRectangle 6.20, Layout.Node.Radius 6.21).
  # 1.14 - lockstep rebuild against DIR.Lib 7.4, no code change. This was the last sibling left on an
  #        older DIR.Lib: 1.13 rebuilt against 7.0 while Console.Lib and SdlVulkan.Renderer have since
  #        moved to 7.4, so a consumer holding both a desktop and a web renderer restored two DIR.Lib
  #        versions and unified on the higher one by luck rather than by intent. 7.4 itself adds
  #        PixelMeasureContext per-axis scales plus a CellAuthored factory, and PixelWidgetBase
  #        Arrange/Paint/RenderLayout overloads taking the measure CONTEXT instead of a bare dpiScale;
  #        both additive, with the scalar overloads delegating through an isotropic context, so this
  #        renderer paints byte-identically.
  # 1.15 - lockstep rebuild against DIR.Lib 7.5, and the version is no longer written here. 7.5 resolves
  #        a font by its DECLARED family rather than by file identity, so every face in a family is
  #        reachable and a run a face cannot cover falls back per run instead of per request; additive,
  #        so this renderer paints byte-identically. Rebuilt because 1.14 left this the last sibling on
  #        7.4 once DIR.Lib, Console.Lib and SdlVulkan.Renderer moved, which is the same split-DIR.Lib
  #        hazard 1.14 itself set out to close.
  VERSION_REV: ${{ github.run_attempt }}
  VERSION_HASH: +${{ github.sha }}
  BUILD_CONF: Release
  # The build job CAPTURES a dotnet invocation's stdout to resolve the version, so the SDK's first-run
  # banner must not be able to land in it.
  DOTNET_NOLOGO: 1

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version prefix
        # Read the version back from the one place it is written (src/Directory.Build.props) instead of
        # restating it here. This is not hypothetical drift: the csproj used to carry its own
        # VersionPrefix 1.14.0, and a local `dotnet pack` published that to nuget.org beside CI's
        # 1.14.181. -getProperty only EVALUATES the file, so it needs no restore and can run first. The
        # value is CAPTURED, so nothing else may print to stdout: DOTNET_NOLOGO (workflow env) keeps the
        # SDK first-run banner out — this is the job's first dotnet call — and the shape check makes
        # anything else unexpected, or a renamed property, fail the run rather than quietly stamping the
        # package ".<run>".
        run: |
          MM="$(dotnet msbuild src/Directory.Build.props -getProperty:VersionMajorMinor -nologo)"
          case "$MM" in
            [0-9]*.[0-9]*) ;;
            *) echo "::error::VersionMajorMinor did not resolve from src/Directory.Build.props (got '$MM')"; exit 1 ;;
          esac
          echo "VERSION_PREFIX=${MM}.${{ github.run_number }}" >> "$GITHUB_ENV"

      # No sibling checkout in CI: DIR.Lib resolves from NuGet (UseLocalDirLib=false via Exists()).
      - name: Restore
        run: dotnet restore src/WebGl.Renderer/WebGl.Renderer.csproj && dotnet restore src/WebGl.Renderer.Tests/WebGl.Renderer.Tests.csproj

      - name: Build
        run: dotnet build src/WebGl.Renderer/WebGl.Renderer.csproj -c $BUILD_CONF --no-restore -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true

      # Headless test surface: command-buffer encoding, shader-source sanity, real-font text
      # encode over a fake JS bridge. Real-browser (Playwright) coverage is a future lane.
      - name: Test
        run: dotnet test src/WebGl.Renderer.Tests/WebGl.Renderer.Tests.csproj -c $BUILD_CONF

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: src/WebGl.Renderer/bin/Release/*.nupkg

  publish-nuget:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Push to nuget.org
        run: dotnet nuget push "**/*.nupkg" -s https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_API_KEY }} --skip-duplicate
